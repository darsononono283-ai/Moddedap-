  <style>
*{box-sizing:border-box}
:root{--ink:#151725;--muted:#777b8d;--purple:#7657e8;--blue:#4b7bec}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{color:var(--ink);background:radial-gradient(circle at 12% 8%,#d9e8ff 0,transparent 32%),radial-gradient(circle at 90% 35%,#eadcff 0,transparent 34%),linear-gradient(145deg,#f4f6ff,#eeeaf8);min-height:100vh}
button,a{-webkit-tap-highlight-color:transparent}
.page{width:min(100%,700px);margin:0 auto;padding:14px 0 28px}
.topbar{height:58px;display:flex;align-items:center;padding:0 20px;margin-bottom:10px}
.topbar h1{font-size:23px;font-weight:850;letter-spacing:-.7px;margin:0;flex:1}
.round-button{width:46px;height:46px;border:0;border-radius:16px;display:grid;place-items:center;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7858e8,#4d78e8);font-size:17px;box-shadow:0 7px 18px #6659d533}
.profile-card{margin:0 12px;padding:25px 18px 22px;border:1px solid #ffffffc9;border-radius:30px;background:rgba(255,255,255,.64);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 45px #46527b18}
.profile{text-align:center;padding:8px 0 28px}
.avatar{width:126px;height:126px;margin:0 auto 17px;overflow:hidden;border-radius:50%;background:#092d49;display:grid;place-items:center;box-shadow:0 9px 25px #30476b35;border:4px solid #fff}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.avatar-fallback{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:850;background:linear-gradient(135deg,#123c61,#7858e8)}
.profile h2{margin:0;font-size:clamp(28px,7vw,36px);font-weight:900;letter-spacing:-1px;color:#191a2a}
.profile p{margin:8px 0 0;color:#777b8d;font-size:14px}
.links{display:grid;gap:13px}
.link-card{min-height:82px;padding:11px 14px;display:flex;align-items:center;gap:14px;border-radius:18px;background:#fff;color:var(--ink);text-decoration:none;border:1px solid #ffffff;box-shadow:0 7px 18px #35436a12;transition:transform .16s,box-shadow .16s}
.link-card:active{transform:scale(.98);box-shadow:0 3px 9px #35436a18}
.link-card.disabled{cursor:default}
.link-thumb{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;border-radius:15px;color:#fff;font-size:25px}
.tiktok{background:linear-gradient(145deg,#242631,#090a0f)}
.channel{background:linear-gradient(145deg,#35d68b,#119d69)}
.website{background:linear-gradient(145deg,#568cf4,#5646c8)}
.link-copy{flex:1;min-width:0}
.link-title{display:block;font-size:16px;font-weight:800;letter-spacing:-.2px}
.link-subtitle{display:block;margin-top:4px;font-size:12px;color:#9295a3}
.link-more{color:#9295a3;padding:10px 3px 10px 8px;font-size:16px}
.footer{text-align:center;color:#9295a3;font-size:11px;padding:20px 0 2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);padding:12px 18px;border-radius:30px;background:#202238;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;box-shadow:0 8px 25px #0002}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:650px){.page{padding-top:24px}.profile-card{padding:34px 28px 26px}.profile{padding-bottom:32px}.avatar{width:140px;height:140px}}
@media(max-width:420px){.page{padding-top:8px}.topbar{height:54px;padding:0 19px}.profile-card{margin:0 9px;padding:22px 14px 18px;border-radius:25px}.avatar{width:118px;height:118px}.link-card{min-height:76px;padding:9px 11px;gap:12px}.link-thumb{width:54px;height:54px;flex-basis:54px}.link-title{font-size:15px}}
</style>

    document.getElementById("profileName").textContent = PROFILE.name;

      const image = document.createElement("img");
      image.src = PROFILE.photo;
      image.alt = "Foto profil DARSONO";
      image.onerror = () => {
        image.remove();
        document.getElementById("avatar").innerHTML =
          '<div class="avatar-fallback">DA</div>';
      };
      document.getElementById("avatar").replaceChildren(image);
    }

    const linkList = document.getElementById("linkList");

    PROFILE.links.forEach(item => {
      const card = document.createElement("a");
      card.className = "link-card";
      card.href = item.url || "#";
      card.setAttribute("aria-label", "Buka " + item.title);

      if (item.url.trim()) {
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      } else {
        card.classList.add("disabled");
        card.addEventListener("click", event => {
          event.preventDefault();
          showToast("Tautan " + item.title + " belum diisi.");
        });
      }

      const thumb = document.createElement("span");
      thumb.className = "link-thumb " + item.style;
      const icon = document.createElement("i");
      icon.className = item.icon;
      icon.setAttribute("aria-hidden", "true");
      thumb.appendChild(icon);

      const copy = document.createElement("span");
      copy.className = "link-copy";
      const title = document.createElement("span");
      title.className = "link-title";
      title.textContent = item.title;
      const subtitle = document.createElement("span");
      subtitle.className = "link-subtitle";
      subtitle.textContent = item.title === "TikTok" ? "Kunjungi akun TikTok" :

                            "Kunjungi website resmi";
      copy.append(title, subtitle);

      const more = document.createElement("span");
      more.className = "link-more";
      more.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>';

      card.append(thumb, copy, more);
      linkList.appendChild(card);
    });

    const toast = document.getElementById("toast");
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 2200);

      };

        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast("Link profil berhasil disalin.");
        } catch (error) {
          showToast("Gagal menyalin link.");
        }
      } else {
        showToast("Salin alamat halaman dari browser.");
      }
    }

    document.getElementById("shareTop").addEventListener("click", sharePage);
